workflows:
  ios-adhoc:
    name: iOS Ad Hoc (Sideloadly Testing)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # ── Triggering ────────────────────────────────────────────────────────────
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: Bridge App Store Connect

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.bridge.bridge

      flutter: stable
      xcode: latest

      groups:
        - bridge_secrets

    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
            > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Generate Riverpod code
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build Ad Hoc IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - simpliceint00@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # ── Triggering ────────────────────────────────────────────────────────────
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: false

    # ── Integrations ──────────────────────────────────────────────────────────
    # Add an App Store Connect API key in Codemagic → Teams → Integrations
    # and name it exactly "Bridge App Store Connect".
    integrations:
      app_store_connect: Bridge App Store Connect

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      # Automatic code signing — Codemagic fetches the certificate and
      # provisioning profile from App Store Connect automatically.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bridge.bridge

      flutter: stable
      xcode: latest

      # Create an environment variable group called "bridge_secrets" in
      # Codemagic → Teams → Global variables and add:
      #   GOOGLE_SERVICE_INFO_PLIST  — base64-encoded GoogleService-Info.plist
      #     macOS: base64 -i GoogleService-Info.plist | pbcopy
      groups:
        - bridge_secrets

    # ── Build scripts ─────────────────────────────────────────────────────────
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
            > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Generate Riverpod code
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build release IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=$(git describe --tags --abbrev=0 | sed 's/^v//') \
            --build-number=$BUILD_NUMBER

    # ── Artifacts ─────────────────────────────────────────────────────────────
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # ── Publishing ────────────────────────────────────────────────────────────
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true when ready for production
      email:
        recipients:
          - simpliceint00@gmail.com
        notify:
          success: true
          failure: true
