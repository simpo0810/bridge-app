workflows:
  ios-adhoc:
    name: iOS Unsigned (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Triggers on every push to master — Codemagic emails you the IPA,
    # then Sideloadly signs and installs it with your free Apple ID.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
            > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Generate Riverpod code
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned IPA
        script: |
          set -e

          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

          APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"

          echo "=== build/ios/iphoneos contents ==="
          ls -la "$CM_BUILD_DIR/build/ios/iphoneos/"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found at $APP"
            exit 1
          fi

          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP" "$IPA_DIR/Payload/Runner.app"
          cd "$IPA_DIR"
          zip -r Runner.ipa Payload
          rm -rf Payload
          echo "=== IPA size: $(du -sh Runner.ipa) ==="

    artifacts:
      - build/ios/ipa/Runner.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - simpliceint00@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # ── Triggering ────────────────────────────────────────────────────────────
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: false

    # ── Integrations ──────────────────────────────────────────────────────────
    # Add an App Store Connect API key in Codemagic → Teams → Integrations
    # and name it exactly "Bridge App Store Connect".
    integrations:
      app_store_connect: Bridge App Store Connect

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      # Automatic code signing — Codemagic fetches the certificate and
      # provisioning profile from App Store Connect automatically.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bridge.bridge

      flutter: stable
      xcode: latest

    # ── Build scripts ─────────────────────────────────────────────────────────
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
            > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Generate Riverpod code
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build release IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=$(git describe --tags --abbrev=0 | sed 's/^v//') \
            --build-number=$BUILD_NUMBER

    # ── Artifacts ─────────────────────────────────────────────────────────────
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # ── Publishing ────────────────────────────────────────────────────────────
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true when ready for production
      email:
        recipients:
          - simpliceint00@gmail.com
        notify:
          success: true
          failure: true
